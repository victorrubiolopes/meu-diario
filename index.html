<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- Evita que o navegador (principalmente em modo "adicionado à tela inicial" no
     celular) guarde este HTML em cache — sem isso, o app pode continuar apontando
     pros arquivos JS/CSS antigos mesmo depois de uma atualização publicada. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Meu Diário</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#b5734a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Diário">
<link rel="stylesheet" href="css/style.css?v=43">
</head>
<body>

<div id="auth-gate" class="auth-gate" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">📔</div>
    <h1>Meu Diário</h1>
    <p class="auth-sub">Entre para acessar seu diário e sincronizar em qualquer aparelho.</p>
    <button class="primary" id="gate-google">Entrar com Google</button>
    <div class="auth-sep">ou com e-mail</div>
    <input type="email" id="gate-email" placeholder="seu@email.com" autocomplete="email">
    <input type="password" id="gate-senha" placeholder="senha (mín. 6 caracteres)" autocomplete="current-password">
    <div class="row" style="margin-top:10px">
      <button class="secondary" id="gate-entrar">Entrar</button>
      <button class="secondary" id="gate-criar">Criar conta</button>
    </div>
    <p class="auth-erro" id="gate-erro"></p>
  </div>
</div>

<div id="onboarding-gate" class="auth-gate" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">👋</div>
    <h1>Vamos te conhecer</h1>
    <p class="auth-sub">Só alguns dados pra calcular sua meta de calorias certinha. Dá pra ajustar tudo depois em Mais → Perfil.</p>
    <div class="row">
      <div><label>Peso (kg)</label><input type="number" id="onboard-peso" step="0.1"></div>
      <div><label>Altura (cm)</label><input type="number" id="onboard-altura"></div>
    </div>
    <div class="row">
      <div><label>Idade</label><input type="number" id="onboard-idade"></div>
      <div>
        <label>Sexo</label>
        <select id="onboard-sexo">
          <option value="masculino">Masculino</option>
          <option value="feminino">Feminino</option>
        </select>
      </div>
    </div>
    <label>Nível de atividade</label>
    <select id="onboard-atividade"></select>
    <label>Objetivo</label>
    <select id="onboard-dieta"></select>
    <div id="onboard-nivel-fields" style="display:none">
      <label>Nível</label>
      <select id="onboard-emagrecimento-nivel"></select>
    </div>
    <p class="auth-sub" id="onboard-dieta-desc" style="margin:4px 0 0;font-size:0.75rem"></p>
    <button class="primary" id="onboard-continuar" style="margin-top:10px">Continuar</button>
    <button class="secondary" id="onboard-pular" style="margin-top:8px">Pular por enquanto</button>
    <p class="auth-erro" id="onboard-erro"></p>
  </div>
</div>

<header class="topbar">
  <button class="back-btn" id="back-btn" style="display:none">←</button>
  <h1 id="page-title">Hoje</h1>
</header>
<div class="date-nav" id="date-nav">
  <button type="button" class="date-nav-arrow" id="date-prev" aria-label="Dia anterior">‹</button>
  <span class="date-pill" id="date-pill-label"></span>
  <button type="button" class="date-nav-arrow" id="date-next" aria-label="Próximo dia">›</button>
</div>

<main id="app"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="inicio">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-5h4v5"/></svg></span><span>Hoje</span>
  </button>
  <button class="nav-btn" data-tab="treino">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="7" width="2" height="10" rx="1"/><rect x="16.5" y="7" width="2" height="10" rx="1"/></svg></span><span>Treino</span>
  </button>
  <button class="nav-btn" data-tab="alimentacao">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span>Comida</span>
  </button>
  <button class="nav-btn" data-tab="medidas">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3"/></svg></span><span>Medidas</span>
  </button>
  <button class="nav-btn" data-tab="mais">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span>Mais</span>
  </button>
</nav>

<button class="fab" id="fab-btn" aria-label="Registrar rápido">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="fab-backdrop" id="fab-backdrop"></div>
<div class="fab-sheet" id="fab-sheet">
  <div class="fab-sheet-handle"></div>
  <button class="fab-option" data-fab-action="alimentacao">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>
    Registrar refeição
  </button>
  <button class="fab-option" data-fab-action="treino">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="7" width="2" height="10" rx="1"/><rect x="16.5" y="7" width="2" height="10" rx="1"/></svg></span>
    Registrar treino
  </button>
  <button class="fab-option" data-fab-action="peso">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3"/></svg></span>
    Registrar peso
  </button>
  <button class="fab-option fab-cancel" id="fab-cancel">Cancelar</button>
</div>

<!-- Firebase (opcional): login e sincronização na nuvem. Se não carregar, o app roda local. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script src="js/util.js?v=43"></script>
<script src="js/storage.js?v=43"></script>
<script src="js/cloud.js?v=43"></script>
<script src="js/db.js?v=43"></script>
<script src="js/chart.js?v=43"></script>
<script src="js/data/exercicios.js?v=43"></script>
<script src="js/data/alimentos.js?v=43"></script>
<script src="js/data/dietas.js?v=43"></script>
<script src="js/data/treinosPredefinidos.js?v=43"></script>
<script src="js/data/planoVictor.js?v=43"></script>

<script src="js/views/inicio.js?v=43"></script>
<script src="js/views/treino.js?v=43"></script>
<script src="js/views/alimentacao.js?v=43"></script>
<script src="js/views/medidas.js?v=43"></script>
<script src="js/views/fotos.js?v=43"></script>
<script src="js/views/exames.js?v=43"></script>
<script src="js/views/tarefas.js?v=43"></script>

<script src="js/views/mais.js?v=43"></script>
<script src="js/app.js?v=43"></script>
</body>
</html>
