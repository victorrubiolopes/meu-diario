<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meu Diário</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="back-btn" id="back-btn" style="display:none">←</button>
  <h1 id="page-title">Início</h1>
  <input type="date" id="date-picker">
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="inicio">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-5h4v5"/></svg></span><span>Início</span>
  </button>
  <button class="nav-btn" data-tab="treino">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="7" width="2" height="10" rx="1"/><rect x="16.5" y="7" width="2" height="10" rx="1"/></svg></span><span>Treino</span>
  </button>
  <button class="nav-btn" data-tab="alimentacao">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span>Comida</span>
  </button>
  <button class="nav-btn" data-tab="medidas">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3"/></svg></span><span>Medidas</span>
  </button>
  <button class="nav-btn" data-tab="mais">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span>Mais</span>
  </button>
</nav>

<button class="fab" id="fab-btn" aria-label="Registrar rápido">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="fab-backdrop" id="fab-backdrop"></div>
<div class="fab-sheet" id="fab-sheet">
  <div class="fab-sheet-handle"></div>
  <button class="fab-option" data-fab-action="alimentacao">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>
    Registrar refeição
  </button>
  <button class="fab-option" data-fab-action="treino">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="7" width="2" height="10" rx="1"/><rect x="16.5" y="7" width="2" height="10" rx="1"/></svg></span>
    Registrar treino
  </button>
  <button class="fab-option" data-fab-action="peso">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3"/></svg></span>
    Registrar peso
  </button>
  <button class="fab-option fab-cancel" id="fab-cancel">Cancelar</button>
</div>

<script src="js/util.js"></script>
<script src="js/storage.js"></script>
<script src="js/db.js"></script>
<script src="js/chart.js"></script>
<script src="js/data/exercicios.js"></script>
<script src="js/data/alimentos.js"></script>
<script src="js/data/dietas.js"></script>
<script src="js/data/treinosPredefinidos.js"></script>
<script src="js/data/combos.js"></script>
<script src="js/views/inicio.js"></script>
<script src="js/views/treino.js"></script>
<script src="js/views/alimentacao.js"></script>
<script src="js/views/medidas.js"></script>
<script src="js/views/fotos.js"></script>
<script src="js/views/tarefas.js"></script>
<script src="js/views/historico.js"></script>
<script src="js/views/mais.js"></script>
<script src="js/app.js"></script>
</body>
</html>
